name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同一 PR 或同一分支的新运行会取消仍在进行的旧运行，避免重复占用 runner。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  whitespace:
    name: Whitespace Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 刚检出的干净工作区直接执行 git diff --check 恒为通过，必须与基线比较。
      - name: Check whitespace errors against base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="origin/${BASE_REF}" ;;
            push) base="$BEFORE_SHA" ;;
            *) base="origin/main" ;;
          esac
          # 新分支首次推送时 before 全为 0，此时回退到上一个提交。
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          mergeBase="$(git merge-base "$base" HEAD)"
          echo "比较基线：$base（merge-base $mergeBase）"
          git diff --check "$mergeBase" HEAD

  # 工作流语法与表达式检查。发布工作流不再由 PR 触发，改动它的 PR 得不到自动演练，
  # 这个检查至少守住语法与表达式；构建与归集阶段仍需发版前手动演练（见 WORKFLOW.md 5.4）。
  # 不使用第三方 action：下载官方发行包并校验固定的 sha256，与 Dockerfile 固定 Pandoc 同一做法。
  # 关闭 shellcheck 与 pyflakes：它们的版本随 runner 镜像变化，会让必需检查出现与 PR 无关的失败。
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint

      # 只检查工作流：复合 action 的 action.yml 不是工作流，传给 actionlint 会产生假错误
      - name: Lint workflows
        run: '"${RUNNER_TEMP}/actionlint" -color -shellcheck= -pyflakes= .github/workflows/*.yml'

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run build

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm test

  # 覆盖率只在 Linux 上收集并与 coverage-thresholds.json 比较（只升不降的棘轮）。
  # 脚本按根 test 脚本的顺序构建并测试各包，因此无需另行安排构建顺序。
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/summary.md
            coverage/*/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7
