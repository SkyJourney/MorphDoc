name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同一 PR 或同一分支的新运行会取消仍在进行的旧运行，避免重复占用 runner。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  whitespace:
    name: Whitespace Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 刚检出的干净工作区直接执行 git diff --check 恒为通过，必须与基线比较。
      - name: Check whitespace errors against base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="origin/${BASE_REF}" ;;
            push) base="$BEFORE_SHA" ;;
            *) base="origin/main" ;;
          esac
          # 新分支首次推送时 before 全为 0，此时回退到上一个提交。
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          mergeBase="$(git merge-base "$base" HEAD)"
          echo "比较基线：$base（merge-base $mergeBase）"
          git diff --check "$mergeBase" HEAD

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run build

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm test
