name: E2E

# 在真实浏览器中加载 Markdown 夹具，验证预览渲染功能，并在 Linux 上做视觉回归。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 重新生成视觉基线（结果以产物下载，由人工审阅后提交）
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 额外的 Playwright 参数。仅在引导首批视觉基线时临时设为 --update-snapshots=missing，
  # 正常情况下必须为空：缺少基线应当让测试失败，而不是悄悄生成。
  PW_ARGS: ''

jobs:
  e2e:
    name: E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'

      # 端到端测试启动真实应用栈，需要已构建的前端运行时与服务端
      - name: Build web runtime and server
        run: pnpm run build:web-runtime && pnpm --filter @morphdoc/server run build

      - name: Run E2E
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          set -euo pipefail
          args=()
          if [ "${UPDATE_SNAPSHOTS:-false}" = "true" ]; then
            args+=(--update-snapshots)
          elif [ -n "${PW_ARGS}" ]; then
            read -r -a args <<< "${PW_ARGS}"
          fi
          if [ "${#args[@]}" -gt 0 ]; then
            pnpm run test:e2e "${args[@]}"
          else
            pnpm run test:e2e
          fi

      # 视觉基线始终上传，便于在更新基线后直接下载并提交
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 14

      # 失败时的差异图、trace 与 HTML 报告
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
